name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-type-unit-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12.8"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Mypy static types
        run: uv run mypy ingestion models processing services
      - name: License and SBOM checks
        run: |
          uv run python scripts/check_licenses.py
          uv run python scripts/generate_sbom.py
      - name: Fast PR checks (unit + contract tests)
        run: uv run pytest tests/unit tests/contracts

  distributed-integration-chaos:
    runs-on: ubuntu-24.04
    needs: lint-type-unit-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12.8"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Distributed integration, E2E, chaos, and benchmark smoke
        run: uv run pytest tests/integration tests/e2e tests/chaos tests/performance
