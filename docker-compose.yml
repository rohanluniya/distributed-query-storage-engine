# Multi-profile Distributed Query & Storage Engine stack
# Profiles: core, analytics, observability, full
# Every container tag is explicitly pinned for reproducible builds.

services:
  worker-1:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.standalone
    image: dqse-engine:1.0.0
    profiles: ["core", "analytics", "full"]
    entrypoint: ["uv", "run", "python", "-m", "services.worker_server", "--worker-id", "worker-1", "--host", "0.0.0.0", "--port", "18091", "--spill-dir", "/data/spill", "--max-mem-mb", "128"]
    volumes:
      - dqse_warehouse:/data
    deploy:
      resources:
        limits:
          memory: 512M

  worker-2:
    image: dqse-engine:1.0.0
    profiles: ["core", "analytics", "full"]
    entrypoint: ["uv", "run", "python", "-m", "services.worker_server", "--worker-id", "worker-2", "--host", "0.0.0.0", "--port", "18092", "--spill-dir", "/data/spill", "--max-mem-mb", "128"]
    volumes:
      - dqse_warehouse:/data
    deploy:
      resources:
        limits:
          memory: 512M

  worker-3:
    image: dqse-engine:1.0.0
    profiles: ["core", "analytics", "full"]
    entrypoint: ["uv", "run", "python", "-m", "services.worker_server", "--worker-id", "worker-3", "--host", "0.0.0.0", "--port", "18093", "--spill-dir", "/data/spill", "--max-mem-mb", "128"]
    volumes:
      - dqse_warehouse:/data
    deploy:
      resources:
        limits:
          memory: 512M

  coordinator:
    image: dqse-engine:1.0.0
    profiles: ["core", "analytics", "full"]
    depends_on:
      - worker-1
      - worker-2
      - worker-3
    entrypoint: ["sh", "-c", "uv run python -m services.cli ingest --scale local --warehouse-dir /data/warehouse && uv run uvicorn services.api:app --host 0.0.0.0 --port 8090"]
    ports:
      - "8090:8090"
    environment:
      DQSE_DATA_DIR: "/data/warehouse"
      DQSE_CATALOG_DB: "/data/catalog.sqlite3"
      DQSE_SPILL_DIR: "/data/spill"
      DQSE_WORKERS: "worker-1=worker-1:18091,worker-2=worker-2:18092,worker-3=worker-3:18093"
      DQSE_API_KEY_ADMIN: "${DQSE_API_KEY_ADMIN:-dev-admin-key-change-me}"
      DQSE_API_KEY_ANALYST: "${DQSE_API_KEY_ANALYST:-dev-analyst-key-change-me}"
      DQSE_API_KEY_VIEWER: "${DQSE_API_KEY_VIEWER:-dev-viewer-key-change-me}"
    volumes:
      - dqse_warehouse:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/health"]
      interval: 15s
      timeout: 5s
      retries: 4
    deploy:
      resources:
        limits:
          memory: 1G

  object-store:
    image: rustfs/rustfs:1.0.6
    profiles: ["analytics", "full"]
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      RUSTFS_ACCESS_KEY: "${RUSTFS_ACCESS_KEY:-dqse-local-access}"
      RUSTFS_SECRET_KEY: "${RUSTFS_SECRET_KEY:-dqse-local-secret}"
    volumes:
      - rustfs_data:/data
    deploy:
      resources:
        limits:
          memory: 512M

  metadata-postgres:
    image: imresamu/postgis:17-3.6.1-alpine3.23
    profiles: ["analytics", "full"]
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-dqse_catalog}"
      POSTGRES_USER: "${POSTGRES_USER:-dqse}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-dqse-dev-change-me}"
    ports:
      - "15432:5432"
    volumes:
      - pg_catalog_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dqse -d dqse_catalog"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: ["observability", "full"]
    ports:
      - "19090:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom_data:/prometheus
    deploy:
      resources:
        limits:
          memory: 512M

  grafana:
    image: grafana/grafana:13.0.14
    profiles: ["observability", "full"]
    ports:
      - "13000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GF_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_ADMIN_PASSWORD:-dqse-grafana-change-me}"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/observability/grafana-dashboard.json:/var/lib/grafana/dashboards/dqse.json:ro
    deploy:
      resources:
        limits:
          memory: 512M

  loki:
    image: grafana/loki:3.6.22
    profiles: ["observability", "full"]
    ports:
      - "13100:3100"
    deploy:
      resources:
        limits:
          memory: 384M

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.166.0-${OTEL_ARCH:-arm64}
    profiles: ["observability", "full"]
    ports:
      - "14317:4317"
      - "14318:4318"
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  dqse_warehouse:
  rustfs_data:
  pg_catalog_data:
  prom_data:
  grafana_data:
