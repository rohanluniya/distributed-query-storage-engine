syntax = "proto3";

package dqse.v1;

service WorkerService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc ExecuteTask(TaskRequest) returns (TaskResponse);
  rpc FetchShuffle(ShuffleFetchRequest) returns (ShuffleFetchResponse);
  rpc CancelQuery(CancelRequest) returns (CancelResponse);
  rpc InvalidateCache(CacheInvalidateRequest) returns (CacheInvalidateResponse);
}

message HealthRequest {}

message HealthResponse {
  string worker_id = 1;
  string status = 2;
  int64 uptime_ms = 3;
  int64 active_tasks = 4;
  int64 mem_used_bytes = 5;
  int64 mem_limit_bytes = 6;
  int64 cache_entries = 7;
  int64 cache_bytes = 8;
  int64 cache_hits = 9;
  int64 cache_misses = 10;
  int64 total_spilled_bytes = 11;
}

message HeartbeatRequest {
  string coordinator_id = 1;
  int64 timestamp_ms = 2;
}

message HeartbeatResponse {
  string worker_id = 1;
  string endpoint = 2;
  string status = 3;
  int64 active_tasks = 4;
  int64 mem_used_bytes = 5;
  int64 mem_limit_bytes = 6;
  int64 cache_entries = 7;
  int64 cache_bytes = 8;
  int64 cache_hits = 9;
  int64 cache_misses = 10;
  int64 total_spilled_bytes = 11;
  int64 timestamp_ms = 12;
}

message TaskRequest {
  string query_id = 1;
  string stage_id = 2;
  string task_id = 3;
  int32 partition_id = 4;
  int32 attempt = 5;
  string lease_id = 6;
  int64 lease_ttl_ms = 7;
  string task_type = 8;
  string spec_json = 9;
  int64 max_mem_bytes = 10;
  bool enable_cache = 11;
  string trace_id = 12;
}

message ShufflePartitionMeta {
  int32 partition_id = 1;
  string worker_id = 2;
  string worker_endpoint = 3;
  string shuffle_key = 4;
  int64 num_rows = 5;
  int64 num_bytes = 6;
}

message TaskResponse {
  string query_id = 1;
  string stage_id = 2;
  string task_id = 3;
  int32 attempt = 4;
  string lease_id = 5;
  bool ok = 6;
  string error = 7;
  bytes arrow_ipc_payload = 8;
  repeated ShufflePartitionMeta shuffle_outputs = 9;
  int64 rows_in = 10;
  int64 rows_out = 11;
  int64 row_groups_scanned = 12;
  int64 row_groups_pruned = 13;
  int64 shuffle_bytes_written = 14;
  int64 peak_mem_bytes = 15;
  int64 spilled_bytes = 16;
  int32 spill_files = 17;
  bool cache_hit = 18;
  double duration_ms = 19;
  string worker_id = 20;
}

message ShuffleFetchRequest {
  string query_id = 1;
  string shuffle_key = 2;
}

message ShuffleFetchResponse {
  bool ok = 1;
  string error = 2;
  bytes arrow_ipc_payload = 3;
  int64 num_rows = 4;
}

message CancelRequest {
  string query_id = 1;
  string reason = 2;
}

message CancelResponse {
  string worker_id = 1;
  int32 cancelled_tasks = 2;
  int64 freed_shuffle_bytes = 3;
}

message CacheInvalidateRequest {
  string table_name = 1;
  int64 new_version = 2;
}

message CacheInvalidateResponse {
  string worker_id = 1;
  int32 evicted_entries = 2;
}
